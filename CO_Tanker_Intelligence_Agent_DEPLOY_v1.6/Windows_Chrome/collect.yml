name: CO Tanker Intelligence — Scheduled Public-Source Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'  # UTC; scheduled jobs may be delayed or skipped
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: co-tanker-intelligence-feed
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'agent/requirements.txt'
      - run: pip install -r agent/requirements.txt
      - name: Collect public source listings
        run: python agent/collector.py --output docs/data/intelligence.json
      - name: Keep auditable feed history in repository
        run: |
          git config user.name "co-tanker-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): refresh public-source intelligence"
            git push
          fi
      # Important: GITHUB_TOKEN-triggered commits do NOT trigger Pages branch builds.
      # Explicit artifact deployment in THIS run ensures the published feed updates.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
